apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-tocabinet
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-tocabinet
  template:
    metadata:
      labels:
        app: frontend-tocabinet
    spec:
      imagePullSecrets:
      - name: aliyun-acr-secret
      containers:
      - name: frontend-tocabinet
        image: crpi-v27gqzero2fjya51.cn-guangzhou.personal.cr.aliyuncs.com/llmproject/frontend_tocabinet:latest
        ports:
        - containerPort: 80
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-tocabinet
  namespace: app
spec:
  selector: {app: frontend-tocabinet}
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP