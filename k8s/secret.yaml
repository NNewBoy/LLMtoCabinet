# LLMtoCabinet 敏感配置（API Key 等）
# 注意：此文件仅作模板，不通过 Jenkins apply
# 首次部署或更换 API Key 时在 K8s Master 手动执行：
# kubectl create secret generic tocabinet-secret \
#   --namespace=app \
#   --from-literal=LLM_API_KEY=your_key_here \
#   --from-literal=LLM_MODEL=deepseek:deepseek-chat \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: tocabinet-secret
  namespace: app
type: Opaque
stringData:
  LLM_API_KEY: "your-api-key-here"
  LLM_MODEL: "deepseek:deepseek-chat"