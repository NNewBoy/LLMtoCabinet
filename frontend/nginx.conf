# LLMtoCabinet 前端容器 Nginx 配置
# 前端部署在 /llmtocabinet/ 子路径
# API 代理 /llmtocabinet/api → backend-tocabinet:8001/api
# WebSocket 代理 /llmtocabinet/ws → backend-tocabinet:8001/ws（需要 Upgrade）

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # WebSocket 反代 → 后端微服务
    # WebSocket 需要保持长连接 + Upgrade 头
    location /llmtocabinet/ws {
        rewrite ^/llmtocabinet/ws/(.*)$ /ws/$1 break;
        proxy_pass http://backend-tocabinet:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 关键配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 反代 → 后端微服务
    location /llmtocabinet/api {
        rewrite ^/llmtocabinet/api/(.*)$ /api/$1 break;
        proxy_pass http://backend-tocabinet:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 无尾斜杠 → 301 到带尾斜杠
    location = /llmtocabinet {
        return 301 /llmtocabinet/;
    }

    # 前端静态文件
    location /llmtocabinet/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /llmtocabinet/index.html;

        location ~* \.(js|css|woff2?|png|jpe?g|gif|ico|svg|wasm)$ {
            root /var/www;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }
    }

    location = / {
        return 302 /llmtocabinet/;
    }
}